services:
  cub3d:
    build:
      context: .
      dockerfile: Dockerfile
    image: cub3d:latest
    container_name: cub3d_game
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host
    # Privileged mode is required for X11 access in some environments
    privileged: true
    stdin_open: true
    tty: true
    command: ./cub3d maps/map.cub
